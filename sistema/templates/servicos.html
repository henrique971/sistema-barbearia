{% extends "base.html" %}
{% block corpo %}
<h1>Serviços</h1>

<table>
  <thead><tr><th>Serviço</th><th>Preço</th><th>Duração</th></tr></thead>
  <tbody>
    {% for s in servicos %}
      <tr><td>{{ s.nome }}</td><td>R$ {{ "%.2f"|format(s.preco) }}</td><td>{{ s.duracao_min }} min</td></tr>
    {% else %}
      <tr><td colspan="3">Nenhum serviço cadastrado.</td></tr>
    {% endfor %}
  </tbody>
</table>

<section class="cartao">
  <h2>Novo serviço</h2>
  <form method="post" action="{{ url_for('servicos') }}">
    <label>Nome <input name="nome" required></label>
    <label>Preço (R$) <input name="preco" inputmode="decimal" required></label>
    <label>Duração (min) <input name="duracao" inputmode="numeric" required></label>
    <button type="submit">Cadastrar</button>
  </form>
</section>
{% endblock %}
