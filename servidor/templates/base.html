<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAEP Barbearia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
{% if session.usuario_id %}
  <header class="topo">
    <span class="marca">✂ SAEP Barbearia</span>
    <nav>
      <a href="/painel">Painel</a>
      <a href="/clientes">Clientes</a>
      <a href="/barbeiros">Barbeiros</a>
      <a href="/servicos">Serviços</a>
      <a href="/agendamentos">Agendamentos</a>
    </nav>
    <span class="usuario">{{ session.nome }} · <a href="/logout">sair</a></span>
  </header>
{% endif %}
<main>
  {% for m in mensagens %}
    <div class="aviso {{ m.categoria }}">{{ m.msg }}</div>
  {% endfor %}
  {% block corpo %}{% endblock %}
</main>
</body>
</html>
